<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- тень-смещение -->
  <rect x="13" y="13" width="44" height="44" rx="10" fill="rgba(21,38,32,0.14)"/>
  <!-- жёлтая плашка -->
  <rect x="8" y="8" width="44" height="44" rx="10" fill="#ffd965" stroke="#152620" stroke-width="2"/>
  <!-- «1С» -->
  <text x="30" y="39" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#123f28" text-anchor="middle" letter-spacing="0.5">1С</text>
  <!-- линейка под надписью -->
  <path d="M16 44h28" stroke="#1e7145" stroke-width="2.4" stroke-linecap="round"/>
  <!-- бейдж-галочка -->
  <circle cx="48" cy="48" r="10.5" fill="#1e7145" stroke="#123f28" stroke-width="2"/>
  <path d="M43.4 48.2l3.4 3.4 6.2-6.8" stroke="#eef2ec" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
